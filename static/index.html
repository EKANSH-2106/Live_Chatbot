<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app-container">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Your Chats</h2>
                <button type="button" id="new-chat-button" class="new-chat-button">
                    + New Chat
                </button>
            </div>

            <div id="conversation-list" class="conversation-list">
                <p class="sidebar-empty">Loading conversations...</p>
            </div>

            <div class="sidebar-footer">
                <span>Powered by Ollama</span>
            </div>
        </aside>

        <section class="chat-container">
            <header class="chat-header">
                <button type="button" id="menu-button" class="menu-button" aria-label="Toggle conversation history"
                    aria-controls="sidebar" aria-expanded="false">☰</button>

                <div class="header-info">
                    <h1>Live Chatbot</h1>
                    <p>Your AI assistant</p>
                </div>

                <span class="status">
                    <span class="status-dot"></span>
                    Local AI
                </span>
            </header>

            <section id="chat-messages" class="chat-messages" aria-live="polite" aria-label="Chat messages"></section>

            <form id="chat-form" class="chat-input-area">
                <input id="message-input" type="text" placeholder="Message your AI assistant..." autocomplete="off"
                    aria-label="Your message" required>
                <button type="submit" id="send-button">Send</button>
            </form>

            <p class="chat-disclaimer">
                Responses are generated locally by your AI model.
            </p>
        </section>

    </main>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script src="script.js"></script>
</body>

</html>
